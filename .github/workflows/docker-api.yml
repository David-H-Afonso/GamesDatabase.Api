name: Build & Push API Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: api-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gamesdatabase-api

jobs:
  quality:
    uses: ./.github/workflows/backend-build.yml

  build-and-push:
    needs: quality
    if: github.ref == 'refs/heads/main' && needs.quality.outputs.already_published != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ needs.quality.outputs.version }}
            type=sha,prefix={{branch}}-
            type=sha

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}

  release:
    needs: [quality, build-and-push]
    if: always() && github.ref == 'refs/heads/main' && needs.quality.result == 'success' && (needs.build-and-push.result == 'success' || (needs.build-and-push.result == 'skipped' && needs.quality.outputs.already_published == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish the tested HEAD version without a second commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_PUBLICATION_ALLOWED: 'true'
        run: node scripts/versioning/release.mjs --publish
